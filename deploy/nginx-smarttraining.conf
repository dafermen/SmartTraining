server {
    listen 80;
    listen [::]:80;
    server_name smarttraining.innovalogic.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name smarttraining.innovalogic.tech;

    ssl_certificate /etc/letsencrypt/live/smarttraining.innovalogic.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smarttraining.innovalogic.tech/privkey.pem;

    root /var/www/smarttraining.innovalogic.tech/public_html;
    index index.html;
    client_max_body_size 500m;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_force_ranges on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
